# values.yaml
# 单节点 + hostNetwork 部署
# MQTT 端口从 1883 改为 11883，其余端口保持不变

replicaCount: 1

image:
  repository: 10.253.3.91:30550/library/emqx
  pullPolicy: IfNotPresent
  tag: "5.8.8"

# Pod 直接使用宿主机网络栈
hostNetwork: true
# hostNetwork=true 时必须设置，否则 DNS 解析异常
dnsPolicy: ClusterFirstWithHostNet

emqxConfig:
  EMQX_CLUSTER__DISCOVERY_STRATEGY: "dns"
  EMQX_DASHBOARD__DEFAULT_USERNAME: "admin"
  EMQX_DASHBOARD__DEFAULT_PASSWORD: "Luculent1!"
  # MQTT TCP 监听器（TLS 后续按需再开）
  EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:11883"
  # 单条 MQTT 消息最大字节数（采集网关 history 消息单条可到 ~2.4MB，默认 1MB 会 reset 连接）
  EMQX_MQTT__MAX_PACKET_SIZE: "10MB"
  # 授权：无匹配规则时拒绝（堵住匿名访问）
  EMQX_AUTHORIZATION__NO_MATCH: "deny"
  # 授权源：文件规则，允许 sys 用户访问所有主题
  EMQX_AUTHORIZATION__SOURCES__1__TYPE: "file"
  EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
  EMQX_AUTHORIZATION__SOURCES__1__PATH: "/opt/emqx/etc/authz.conf"
  # 认证器：内置数据库 + 用户名密码
  EMQX_AUTHENTICATION__1__MECHANISM: "password_based"
  EMQX_AUTHENTICATION__1__BACKEND: "built_in_database"
  EMQX_AUTHENTICATION__1__USER_ID_TYPE: "username"
  # 首次启动（空库）自动导入 MQTT 用户，见下方 mqttAuth 段
  EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: "/opt/emqx/etc/bootstrap_user.json"
  EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: "plain"

ssl:
  enabled: false
  useExisting: false
  existingName: ""
  issuer:
    name: ""
    kind: ""
  commonName: ""
  dnsnames: []

# MQTT 认证用户（首次空库启动时通过 bootstrap_file 自动导入）
mqttAuth:
  username: "sys"
  password: "Luculent1!"

ingress:
  dashboard:
    enabled: false
    annotations: {}
    ingressClassName: ""
    hosts: []
    path: /
    pathType: ImplementationSpecific
    tls: []
  mqtt:
    enabled: false
    annotations: {}
    ingressClassName: ""
    hosts: []
    path: /
    pathType: ImplementationSpecific
    tls: []
  ws:
    enabled: false
    annotations: {}
    ingressClassName: ""
    hosts: []
    path: /mqtt
    pathType: ImplementationSpecific
    tls: []

service:
  type: ClusterIP
  clusterIP: ""
  mqtt: 11883
  mqttssl: 8883
  ws: 8083
  wss: 8084
  dashboard: 18083
  nodePorts:
    mqtt:
    mqttssl:
    mgmt:
    ws:
    wss:
    dashboard:
    dashboardtls:
  loadBalancerSourceRanges: []
  externalIPs: []
  externalTrafficPolicy: "Cluster"
  annotations: {}
  labels: {}

persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

podSecurityContext:
  enabled: true
  fsGroup: 1000
  fsGroupChangePolicy: Always
  runAsUser: 1000
  supplementalGroups:
    - 1000

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  type: prometheus
  interval: 15s
  metricRelabelings:
    - sourceLabels: [topic]
      regex: ".+"
      action: drop

serviceAccount:
  create: true
  name: ""
  annotations: {}

pdb:
  enabled: false
