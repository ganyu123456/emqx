name: Build and Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build-amd64:
    name: Build and Push amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.zkjgy.online
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            harbor.zkjgy.online/library/emqx:5.8.8-amd64

      - name: Save amd64 image as tar.gz
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull harbor.zkjgy.online/library/emqx:5.8.8-amd64
          # 客户平台按文件名区分架构、要求两个异构镜像内部 tag 一致，故统一为 5.8.8 再保存
          docker tag harbor.zkjgy.online/library/emqx:5.8.8-amd64 harbor.zkjgy.online/library/emqx:5.8.8
          docker save harbor.zkjgy.online/library/emqx:5.8.8 \
            | gzip > emqx-amd64.tar.gz

      - name: Upload amd64 artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: emqx-amd64
          path: emqx-amd64.tar.gz

  build-arm64:
    name: Build and Push arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.zkjgy.online
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            harbor.zkjgy.online/library/emqx:5.8.8-arm64

      - name: Save arm64 image as tar.gz
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull --platform linux/arm64 harbor.zkjgy.online/library/emqx:5.8.8-arm64
          # 客户平台按文件名区分架构、要求两个异构镜像内部 tag 一致，故统一为 5.8.8 再保存
          docker tag harbor.zkjgy.online/library/emqx:5.8.8-arm64 harbor.zkjgy.online/library/emqx:5.8.8
          docker save harbor.zkjgy.online/library/emqx:5.8.8 \
            | gzip > emqx-arm64.tar.gz

      - name: Upload arm64 artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: emqx-arm64
          path: emqx-arm64.tar.gz

  manifest:
    name: Create and Push Manifest
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.zkjgy.online
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and Push Versioned Manifest
        run: |
          docker buildx imagetools create \
            --tag harbor.zkjgy.online/library/emqx:5.8.8 \
            harbor.zkjgy.online/library/emqx:5.8.8-amd64 \
            harbor.zkjgy.online/library/emqx:5.8.8-arm64

  helm-package-push:
    name: Helm Package and Push
    runs-on: ubuntu-latest
    needs:
      - manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Login and Push
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          helm registry login harbor.zkjgy.online \
            --username $HARBOR_USERNAME \
            --password $HARBOR_PASSWORD
          helm package helm/emqx --version 5.8.8 --app-version 5.8.8
          helm push emqx-5.8.8.tgz oci://harbor.zkjgy.online/charts

      - name: Upload helm artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: emqx-helm
          path: emqx-5.8.8.tgz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - helm-package-push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: emqx-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: emqx-arm64

      - name: Download helm artifact
        uses: actions/download-artifact@v4
        with:
          name: emqx-helm

      - name: Build offline package
        run: |
          PKG_DIR="emqx-5.8.8-offline"
          mkdir -p "$PKG_DIR"
          cp emqx-amd64.tar.gz "$PKG_DIR/"
          cp emqx-arm64.tar.gz "$PKG_DIR/"
          cp emqx-5.8.8.tgz "$PKG_DIR/"
          cp paramSchema.json "$PKG_DIR/"
          tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            emqx-5.8.8.tgz
            emqx-amd64.tar.gz
            emqx-arm64.tar.gz
            paramSchema.json
            emqx-5.8.8-offline.tar.gz
